<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼 예제</title>
</head>
<body>
    <h1>폼 예제</h1>
    <form method="post">
        아이디:<input type="text" name="t1" value=""><br>
        암 호:<input type="password" name="p1" value=""><br>
        <input type="button" name="b1" value="버튼1"><br>
        <input type="checkbox" name="c1" value="v1">C<br>
        <input type="checkbox" name="c2" value="v2">Python<br>
        <input type="checkbox" name="c3" value="v3">JS<br>
        <input type="radio" name="r1" value="rv1">Front<br>
        <input type="radio" name="r1" value="rv2">Back<br>
        <input type="radio" name="r1" value="rv3">Full<br>
        <input type="radio" name="r2" value="rv1">Front<br>
        <input type="radio" name="r2" value="rv2">Back<br>
        <hr>
        <input type="hidden" name="h1" value="hv1"><br>
        <hr>
        <input type="file" name="f1"><br>
        좋아하는 과일:
        <select name="s1">
            <option value="sv1">사과</option>
            <option value="sv2">배</option>
            <option value="sv3" selected>포도</option>
            <option value="sv4">감</option>
        </select><br>
        <textarea name="ta1" cols="50" rows="10">초기 입력된 텍스트</textarea>
        <input type="submit" name="sm" value="전송"><br>
        <input type="reset" name="rs" value="초기화"><br>
    </form>
</body>
</html>

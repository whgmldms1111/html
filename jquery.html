<html>
<head>
    <style>
        .c1{
            color: rgb(54, 121, 208);
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $('button').click(function(){
                $('p').css('color','red');
                $('p').css('backgroundColor','black');
                $('img').attr('src','https://placehold.co/200x200');
                $('#t1').text('<a href="https://www.syu.ac.kr">text()</a>');
                $('#t2').html('<a href="https://www.syu.ac.kr">html()</a>');
                $('#t1').toggleClass('c1');
            });
        });
    </script>
</head>
<body>
    <h1>jQuery 예제</h1>
    <p>삼육대학교</p>
    <p id="t1">인공지능융합학부</p>
    <p id="t2">웹프로그래밍</p>
    <img><br>
    <img src="https://placehold.co/100x100"><br>
    <button>Click me</button>
</body>
</html>
